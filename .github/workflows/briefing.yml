name: Fernwaerme Briefing

on:
  schedule:
    # Mehrere Anlaeufe mit Absicht. GitHub garantiert die Ausfuehrung geplanter
    # Workflows nicht und laesst sie unter Last aus. Der erste erfolgreiche Lauf
    # des Tages setzt das Ausgabedatum, spaetere brechen dann sofort ab.
    # Zeiten in UTC, im Winter jeweils eine Stunde spaeter eintragen.
    - cron: "17 4 * * 1-5"
    - cron: "23 5 * * 1-5"
    - cron: "31 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # Feste Version mit Absicht. Der mitlaufende Zeiger @v1 zeigte zeitweise
      # auf v1.0.100, die einen Installationsfehler hatte und mit
      # "native binary not found" abbrach. v1.0.99 laeuft stabil.
      - uses: anthropics/claude-code-action@v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 45
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash"
          prompt: |
            Du pflegst das Fernwaerme Briefing in diesem Repository. Es ist eine
            interne Arbeitsunterlage fuer einen Fachbereich Fernwaerme, kein
            persoenliches Produkt. Sprich niemanden namentlich an, nenne keine
            Personennamen als Empfaenger, schreibe sachlich in der dritten
            Person. Deutsch, keine Emojis, keine Gedankenstriche als Satzzeichen.

            AUFBAU DES REPOSITORIES. Die Seite besteht aus vier HTML-Dateien und
            einem gemeinsamen Stylesheet:
              index.html        Startseite, grober Ueberblick, dein Hauptauftrag
              regulatorik.html  Schwerpunktseite Regulatorik, FFVAV und Folgen
              versorger.html    Versorger-Watch, fuenf groesste Netze und Preise
              archiv.html       Archiv frueherer Meldungen
              assets/style.css  gemeinsames Stylesheet aller vier Seiten
            Aendere assets/style.css nicht. Schreibe niemals einen style-Block
            in eine der HTML-Dateien zurueck, alle vier binden das Stylesheet
            ueber <link rel="stylesheet" href="assets/style.css"> ein.

            UNANTASTBAR IN JEDER DATEI: der Block <nav class="nav"> direkt nach
            <body> und die Zeile mit assets/style.css im Kopf. In index.html
            zusaetzlich der Block <div class="cards"> mit den drei Verweisen auf
            die Unterseiten. Diese Teile bleiben Zeichen fuer Zeichen stehen.
            Kontrolliere das vor dem Commit.

            SCHRITT 0, Doppellauf-Schutz. Der Ausloeser dieses Laufs ist:
            ${{ github.event_name }}. Dieser Schritt gilt NUR, wenn dort
            "schedule" steht. Ermittle in dem Fall mit dem Befehl date das
            heutige Datum und lies die Kopfzeile von index.html, dort steht
            "Ausgabe <Datum>". Traegt die Seite bereits das heutige Datum, ist
            die Ausgabe fertig: beende sofort, aendere nichts, committe nichts
            und schreibe nur eine Zeile, dass die Ausgabe des Tages vorliegt.
            Bei jedem anderen Ausloeser, insbesondere workflow_dispatch, also
            einem Handstart, arbeite immer weiter, auch wenn das Datum schon
            stimmt. Ein Handstart ist eine bewusste Anforderung.

            GRUNDREGEL, die wichtigste ueberhaupt: Die Seite ist ein fortlaufend
            gepflegtes Lagebild, kein taeglich neu geschriebener Text. Fasse
            NIEMALS dieselbe Meldung zweimal neu zusammen. Was gestern schon
            dastand und sich nicht veraendert hat, bleibt Wort fuer Wort stehen.
            Aendere an einem Tag ohne Neuigkeiten nur das Ausgabedatum in der
            Kopfzeile und den Kasten "Neu in dieser Ausgabe", in dem dann offen
            steht, dass es keine neuen Meldungen gibt.

            SCHRITT 1, bestehenden Stand lesen. Lies index.html vollstaendig.
            Merke dir, welche Meldungen und welche Zeilen der Lagetafel bereits
            vorhanden sind, mit ihren Daten und Quellen. Uebernimm Struktur,
            Klassennamen und Gestaltung unveraendert. Binde keine externen
            Schriften, Skripte, Bilder oder Dienste ein, die Seiten muessen ohne
            jede externe Verbindung auskommen und duerfen keine Cookies setzen.
            Lies die Unterseiten in diesem Schritt NICHT. Du liest eine
            Unterseite nur dann, wenn die Recherche in Schritt 2 einen Anlass
            dafuer ergeben hat. archiv.html liest du nie vollstaendig.

            SCHRITT 2, Recherche. Suche gezielt nach dem, was seit dem letzten
            Ausgabedatum NEU ist, etwa zehn bis fuenfzehn Suchen und Abrufe.
            Themen in dieser Reihenfolge:
            a) Fernwaerme und Waermenetze Deutschland: Waermenetzpaket,
               Waermenetzgesetz, FFVAV, AVBFernwaermeV, Waermeplanungsgesetz,
               BEW-Foerderung, Preisaufsicht und Preistransparenz,
               Bundeskartellamt, Gerichtsverfahren zu Preisaenderungsklauseln,
               Preisentwicklung, Netzausbau, Grosswaermepumpen, Tiefengeothermie,
               Abwaerme, KWK, Stadtwerke- und Versorgermeldungen.
            b) Fernwaerme Europa: EU Heating and Cooling Strategy, EPBD, ETS 2,
               Euroheat and Power, Daenemark, Schweden, Niederlande, Oesterreich,
               Polen.
            c) Allgemeine Energiewirtschaft, soweit fuer Waermenetze relevant:
               Strom- und Gasmarkt, Netzentgelte, Kapazitaetsmarkt und StromVKG,
               CO2-Preis, EEG, Gebaeudeenergierecht GModG, Bundesnetzagentur.

            Gute Quellen: zfk.de, energie-und-management.de, agfw.de, bdew.de,
            vzbv.de, bundeskartellamt.de, bundesnetzagentur.de,
            bundesregierung.de, bundeswirtschaftsministerium.de,
            stadt-und-werk.de, iwr.de, euroheat.org, energy-cities.eu, c-ober.de.

            SCHRITT 3, Startseite pflegen. Die Seite hat Bereiche mit sehr
            unterschiedlicher Aenderungsfrequenz. Behandle sie unterschiedlich:

            "Neu in dieser Ausgabe": Nur echte Veraenderungen seit der letzten
            Ausgabe, zwei bis vier kurze Punkte. Gab es nichts, schreibe das
            offen hinein.

            "Aktuelle Meldungen": Rollierend, neueste zuerst, hoechstens sechs
            Eintraege. Neue Meldungen kommen oben dazu mit der Markierung
            pill pill-neu und dem Wort Neu. Eine bestehende Meldung bekommt die
            Markierung pill pill-upd mit dem Wort Aktualisiert nur dann, wenn es
            wirklich einen neuen Sachstand gibt, und dann ergaenzt du den
            bestehenden Text, statt ihn neu zu schreiben. Eine Meldung, die
            aelter als etwa zwei Wochen ist und keinen Nachrichtenwert mehr hat,
            wird geloescht oder ihr Kern wandert als Zeile in die Lagetafel.
            Setze die Markierung Neu bei der naechsten Ausgabe zurueck auf
            pill pill-lauf mit dem Wort Einordnung.

            "Laufende Vorhaben und Verfahren": Die Tabelle ist der stabile Teil.
            Aendere eine Zeile nur, wenn sich der Sachstand oder der naechste
            Schritt tatsaechlich bewegt hat. Neue Vorhaben kommen als Zeile
            hinzu, abgeschlossene fallen raus.

            "Markt und Technik": Datenstaende, die sich selten aendern. Nur
            anfassen, wenn neue Zahlen veroeffentlicht wurden. Dann auch die
            Kennzahlenleiste oben entsprechend nachziehen.

            "Termine": Abgelaufene Termine entfernen, neue ergaenzen, nach Datum
            sortiert.

            Zum Schluss das Ausgabedatum in der Kopfzeile auf das heutige Datum
            setzen.

            SCHRITT 3a, Archiv fortschreiben. Nur wenn du in Schritt 3 eine
            Meldung aus "Aktuelle Meldungen" entfernt hast. Haenge fuer jede
            entfernte Meldung EINE Zeile in archiv.html an, unmittelbar nach der
            Zeile <tbody>, damit die neueste oben steht. Form der Zeile:
            <tr><td class="d">TT.MM.JJJJ</td><td>Ueberschrift<div class="src"
            style="margin-top:6px"><a href="URL">Quelle</a></div></td></tr>
            Nutze dafuer das Werkzeug Edit mit dem alten Text <tbody> und dem
            neuen Text <tbody> plus deiner Zeile. Lies die Datei dabei nicht
            vollstaendig ein, sie waechst mit der Zeit stark an. Erhoehe
            ausserdem die Zahl hinter "Eintraege" in der Kopfzeile. Wurde keine
            Meldung entfernt, fasse archiv.html gar nicht an.

            SCHRITT 3b, Unterseiten. Diese Seiten sind bewusst traege, sie sind
            keine Nachrichtenseiten. Fasse sie nur an, wenn die Recherche einen
            echten Anlass ergeben hat:
            regulatorik.html nur bei einer Rechtsaenderung, einem neuen
            Referentenentwurf, einem Kabinettsbeschluss, einer Verkuendung im
            Bundesgesetzblatt, einem einschlaegigen Urteil oder einer neuen Frist
            zu FFVAV, AVBFernwaermeV, Waermenetzgesetz, Waermeplanungsgesetz
            oder Heizkostenverordnung. Passe dann die betroffene Stelle an und
            setze das Datum hinter "Stand" in der Kopfzeile neu.
            versorger.html nur bei einer Preisaenderung, einem neuen Preisblatt,
            einem Tarifwechsel oder einer strategischen Meldung zu BEW Berlin,
            Hamburger Energiewerke, Stadtwerke Muenchen, Iqony oder Stadtwerke
            Flensburg. Zahlen aus Preisblaettern uebernimmst du nur, wenn du das
            Dokument in diesem Lauf tatsaechlich abgerufen hast, und du schreibst
            immer dazu, ob der Wert netto oder brutto ist und ab wann er gilt.
            Ist an einem Tag nichts davon der Fall, bleiben beide Seiten
            unveraendert. Das ist der Normalfall.

            SCHRITT 4, Pruefung vor dem Commit. Jeder Link muss in deiner
            Recherche tatsaechlich aufgetaucht sein, erfinde keine URLs. Datums-
            angaben und Zahlen muessen mit den Quellen uebereinstimmen. Keine
            Aussage ohne Quellenlink. Kein Personenname als Empfaenger. Keine
            externe Ressource im HTML. Pruefe, dass die Navigation, die
            Stylesheet-Zeile und in index.html der Kartenblock unveraendert
            vorhanden sind. Pruefe, dass du keine bestehende Meldung ohne
            sachlichen Grund umformuliert hast.

            SCHRITT 5, Veroeffentlichen. Committe alle geaenderten Dateien mit
            einer Nachricht der Form "Briefing <Datum>" und pushe nach main.
